<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Fokira Cafe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#fff8f0] px-6 lg:px-20 py-8">
<a href="index.html" class="font-bold"><i class="fa-solid fa-arrow-left mr-2"></i> Back to Home</a>
<h1 class="text-3xl font-black mt-6">Our Hot Menu</h1>

<div class="grid md:grid-cols-3 gap-6 mt-8" id="menu">
<!-- Item -->
<div class="bg-white p-4 rounded-2xl shadow-sm">
<img src="https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400" class="h-40 w-full object-cover rounded-xl">
<h3 class="font-bold mt-3">Chicken Burger</h3><p class="text-xs text-slate-500">Juicy chicken + cheese</p>
<div class="flex justify-between items-center mt-3"><span class="font-black text-orange-500">180 TK</span><button onclick="addToCart('Chicken Burger',180)" class="bg-black text-white px-4 py-1.5 rounded-full text-xs">Add +</button></div>
</div>
<div class="bg-white p-4 rounded-2xl shadow-sm">
<img src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=400" class="h-40 w-full object-cover rounded-xl">
<h3 class="font-bold mt-3">Special Biriyani</h3><p class="text-xs text-slate-500">Fokira special recipe</p>
<div class="flex justify-between items-center mt-3"><span class="font-black text-orange-500">220 TK</span><button onclick="addToCart('Biriyani',220)" class="bg-black text-white px-4 py-1.5 rounded-full text-xs">Add +</button></div>
</div>
<div class="bg-white p-4 rounded-2xl shadow-sm">
<img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=400" class="h-40 w-full object-cover rounded-xl">
<h3 class="font-bold mt-3">Cold Coffee</h3><p class="text-xs text-slate-500">Chilled & creamy</p>
<div class="flex justify-between items-center mt-3"><span class="font-black text-orange-500">120 TK</span><button onclick="addToCart('Cold Coffee',120)" class="bg-black text-white px-4 py-1.5 rounded-full text-xs">Add +</button></div>
</div>
</div>

<div class="bg-white p-6 rounded-2xl mt-10 max-w-md shadow-lg sticky bottom-5">
<h3 class="font-black">Your Cart <span id="count">0</span> items</h3>
<div id="cart" class="text-sm text-slate-500 mt-2">Empty cart</div>
<h3 class="font-black mt-3">Total: <span id="total">0</span> TK</h3>
<button onclick="alert('Order Placed! Thanks for choosing Fokira Cafe ❤️')" class="w-full bg-orange-500 text-white py-2 rounded-full font-bold mt-3">Place Order</button>
</div>

<script>
let cart=[], total=0;
function addToCart(name,price){cart.push(name);total+=price;document.getElementById('count').innerText=cart.length;document.getElementById('total').innerText=total;document.getElementById('cart').innerHTML=cart.join(', ');}
</script>
</body>
</html>
